<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의실 목록 - 강의실 대여 시스템</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>

<div class="app-container">
  <!-- 데스크탑 헤더 -->
  <header class="desktop-header">
    <div class="logo">🏛️ 강의실 <span>대여</span> 시스템</div>
    <div class="header-right">
      <div class="user-info">👤 <span class="user-name-display"></span></div>
      <button class="header-logout-btn logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 데스크탑 사이드바 -->
  <aside class="desktop-sidebar">
    <div style="padding:20px 24px;margin-bottom:8px;">
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:16px;">
        <div style="font-size:var(--font-sm);color:rgba(255,255,255,0.6);margin-bottom:4px;">👤 <span class="user-id-display"></span></div>
        <div style="font-size:var(--font-lg);font-weight:700;color:white;" class="user-name-display"></div>
        <div style="font-size:var(--font-xs);color:var(--accent);font-weight:600;" class="user-role-display"></div>
      </div>
    </div>
    <div class="sidebar-label">메뉴</div>
    <ul class="sidebar-nav">
      <li><a href="home.html" data-page="home"><span class="nav-icon">🏠</span> 홈</a></li>
      <li><a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span> 강의실 목록</a></li>
      <li><a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span> 내 예약</a></li>
      <li><a href="profile.html" data-page="profile"><span class="nav-icon">👤</span> 내 정보</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav admin-only">
      <li><a href="admin.html" data-page="admin"><span class="nav-icon">🛠️</span> 관리자 페이지</a></li>
    </ul>
    <div style="margin-top:auto;padding:20px 12px 0;">
      <button class="logout-btn" style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:8px;color:rgba(255,255,255,0.6);font-size:var(--font-sm);width:100%;background:none;border:none;cursor:pointer;">
        <span>🚪</span> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 모바일 헤더 -->
  <header class="mobile-header">
    <div class="logo">🚪 강의실 목록</div>
    <div class="header-actions">
      <span class="user-badge user-name-display"></span>
      <button class="header-logout-btn logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 메인 -->
  <main class="main-content">
    <div class="page-title">강의실 목록</div>
    <div class="page-subtitle">원하는 강의실을 선택해 예약하세요</div>

    <!-- 검색 -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="강의실 이름 검색..." oninput="filterRooms()">
    </div>

    <!-- 층별 필터 -->
    <div class="filter-tabs" id="floor-tabs">
      <button class="filter-tab active" onclick="selectFloor(0, this)">전체</button>
      <button class="filter-tab" onclick="selectFloor(1, this)">1층</button>
      <button class="filter-tab" onclick="selectFloor(2, this)">2층</button>
      <button class="filter-tab" onclick="selectFloor(3, this)">3층</button>
      <button class="filter-tab" onclick="selectFloor(4, this)">4층</button>
      <button class="filter-tab" onclick="selectFloor(5, this)">5층</button>
      <button class="filter-tab" onclick="selectFloor(6, this)">6층</button>
    </div>

    <!-- 상태 범례 -->
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
      <span class="status-badge status-available">대여 가능</span>
      <span class="status-badge status-rented">대여 중</span>
      <span class="status-badge status-class">수업 시간</span>
      <span class="status-badge status-unavailable">사용 불가</span>
    </div>

    <!-- 강의실 목록 -->
    <div id="room-list" class="room-grid"></div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <span class="empty-icon">🔍</span>
      <div class="empty-title">검색 결과가 없습니다</div>
      <div class="empty-desc">다른 키워드나 필터를 사용해보세요</div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="home.html" data-page="home"><span class="nav-icon">🏠</span><span>홈</span></a>
    <a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span><span>강의실</span></a>
    <a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span><span>내 예약</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-icon">👤</span><span>내 정보</span></a>
  </nav>
</div>

<script src="../js/data.js"></script>
<script>
if (!initPage('rooms')) {}

let selectedFloor = 0;

function selectFloor(floor, btn) {
  selectedFloor = floor;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterRooms();
}

function filterRooms() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const rooms = DB.rooms.filter(room => {
    const matchFloor = selectedFloor === 0 || room.floor === selectedFloor;
    const matchSearch = room.room_name.toLowerCase().includes(query) ||
                        room.location.toLowerCase().includes(query);
    return matchFloor && matchSearch;
  });

  const list = document.getElementById('room-list');
  const empty = document.getElementById('empty-state');

  if (rooms.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  list.innerHTML = rooms.map(room => {
    const status = Room.getCurrentStatus(room.room_id);
    const isClickable = status === 'available' || status === 'rented';
    return `
      <div class="room-card" onclick="location.href='room-detail.html?id=${room.room_id}'">
        <div class="room-card-inner">
          <div class="room-icon">${room.icon}</div>
          <div class="room-info">
            <div class="room-name">${room.room_name}</div>
            <div class="room-floor">${room.location}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center;">
              <span class="status-badge status-${status}">${Room.getStatusLabel(status)}</span>
              ${room.requires_approval ? '<span class="approval-required">🔑 승인 필요</span>' : ''}
            </div>
          </div>
          <span class="room-arrow">›</span>
        </div>
        ${!room.is_active ? '<div style="background:rgba(149,165,166,0.15);padding:8px 20px;font-size:var(--font-xs);color:var(--text-sub);font-weight:600;">⚠️ 현재 사용 불가</div>' : ''}
      </div>
    `;
  }).join('');
}

filterRooms();
</script>
</body>
</html>
