<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 강의실 대여 시스템</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: none;
    }
  </style>
</head>

<body>
  <div id="toast-container"></div>

  <div class="login-page">
    <div class="login-logo">
      <span class="logo-icon">📝</span>
      <h1>회원<span>가입</span></h1>
      <p>학사정보 연동 없이 자유롭게 계정을 생성하세요</p>
    </div>

    <div class="login-card">
      <h2>새 계정 만들기</h2>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">
            이름 (실명) <span class="required">*</span>
          </label>
          <input type="text" id="reg-name" class="form-input" placeholder="이름을 입력하세요 (예: 홍길동)" maxlength="20" required>
          <div class="form-hint">시스템 및 예약 명단에 표시되는 이름입니다.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-student-id">
            학번 또는 ID <span class="required">*</span>
          </label>
          <input type="text" id="reg-student-id" class="form-input" placeholder="학번 또는 사용할 ID를 입력하세요" maxlength="20" required>
          <div class="form-hint">로그인 시 사용할 고유 식별자입니다.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">
            비밀번호 <span class="required">*</span>
          </label>
          <div style="position:relative">
            <input type="password" id="reg-password" class="form-input" placeholder="비밀번호를 입력하세요" autocomplete="new-password" required>
            <button type="button" id="toggle-reg-pw" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--text-light);background:none;border:none;cursor:pointer">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password-confirm">
            비밀번호 확인 <span class="required">*</span>
          </label>
          <input type="password" id="reg-password-confirm" class="form-input" placeholder="비밀번호를 다시 한 번 입력하세요" autocomplete="new-password" required>
        </div>

        <div id="reg-error" class="alert alert-danger" style="display:none">
          <span class="alert-icon">⚠️</span>
          <span id="reg-error-msg"></span>
        </div>

        <div class="alert alert-info" style="font-size:var(--font-xs);margin-bottom:20px;">
          <span class="alert-icon">🔒</span>
          <span>입력하신 계정 정보는 안전하게 암호화되어 저장됩니다.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="reg-btn">
          ✅ 회원가입 완료
        </button>

        <a href="../index.html" class="btn btn-ghost btn-full" style="margin-top:12px;border:1px solid var(--border);text-align:center;">
          ← 로그인 화면으로 돌아가기
        </a>
      </form>
    </div>

    <div class="login-footer">
      <p>© 2026 강의실 대여 시스템 | 자유로운 계정 등록</p>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script>
    // 비밀번호 보기 토글
    document.getElementById('toggle-reg-pw').addEventListener('click', function () {
      const pw = document.getElementById('reg-password');
      if (pw.type === 'password') {
        pw.type = 'text';
        this.textContent = '🙈';
      } else {
        pw.type = 'password';
        this.textContent = '👁';
      }
    });

    // 회원가입 폼 제출
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const studentId = document.getElementById('reg-student-id').value.trim();
      const password = document.getElementById('reg-password').value;
      const passwordConfirm = document.getElementById('reg-password-confirm').value;
      const errorDiv = document.getElementById('reg-error');
      const errorMsg = document.getElementById('reg-error-msg');
      const btn = document.getElementById('reg-btn');

      if (!name || !studentId || !password) {
        errorMsg.textContent = '모든 필수 항목을 입력해주세요.';
        errorDiv.style.display = 'flex';
        return;
      }

      if (password !== passwordConfirm) {
        errorMsg.textContent = '비밀번호와 비밀번호 확인이 일치하지 않습니다.';
        errorDiv.style.display = 'flex';
        return;
      }

      if (password.length < 4) {
        errorMsg.textContent = '비밀번호는 최소 4자 이상이어야 합니다.';
        errorDiv.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btn.textContent = '처리 중...';

      setTimeout(() => {
        const result = Auth.register(name, studentId, password);
        if (result.success) {
          showToast('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.', 'success', 3000);
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 1200);
        } else {
          errorMsg.textContent = result.error;
          errorDiv.style.display = 'flex';
          btn.disabled = false;
          btn.textContent = '✅ 회원가입 완료';
        }
      }, 350);
    });
  </script>
</body>

</html>
