<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 예약 - 강의실 대여 시스템</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>

<div class="app-container">
  <!-- 데스크탑 헤더 -->
  <header class="desktop-header">
    <div class="logo">🏛️ 강의실 <span>대여</span> 시스템</div>
    <div class="header-right">
      <div class="user-info">👤 <span class="user-name-display"></span></div>
      <button class="header-logout-btn logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 데스크탑 사이드바 -->
  <aside class="desktop-sidebar">
    <div style="padding:20px 24px;margin-bottom:8px;">
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:16px;">
        <div style="font-size:var(--font-sm);color:rgba(255,255,255,0.6);margin-bottom:4px;">👤 <span class="user-id-display"></span></div>
        <div style="font-size:var(--font-lg);font-weight:700;color:white;" class="user-name-display"></div>
        <div style="font-size:var(--font-xs);color:var(--accent);font-weight:600;" class="user-role-display"></div>
      </div>
    </div>
    <div class="sidebar-label">메뉴</div>
    <ul class="sidebar-nav">
      <li><a href="home.html" data-page="home"><span class="nav-icon">🏠</span> 홈</a></li>
      <li><a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span> 강의실 목록</a></li>
      <li><a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span> 내 예약</a></li>
      <li><a href="profile.html" data-page="profile"><span class="nav-icon">👤</span> 내 정보</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav admin-only">
      <li><a href="admin.html" data-page="admin"><span class="nav-icon">🛠️</span> 관리자 페이지</a></li>
    </ul>
    <div style="margin-top:auto;padding:20px 12px 0;">
      <button class="logout-btn" style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:8px;color:rgba(255,255,255,0.6);font-size:var(--font-sm);width:100%;background:none;border:none;cursor:pointer;">
        <span>🚪</span> 로그아웃
      </button>
    </div>
  </aside>

  <!-- 모바일 헤더 -->
  <header class="mobile-header">
    <div class="logo">📋 내 예약</div>
    <div class="header-actions">
      <span class="user-badge user-name-display"></span>
      <button class="header-logout-btn logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 메인 -->
  <main class="main-content">
    <div class="page-title">내 예약 내역</div>
    <div class="page-subtitle">나의 강의실 예약 현황을 확인하세요</div>

    <!-- 필터 -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterStatus('all', this)">전체</button>
      <button class="filter-tab" onclick="filterStatus('reserved', this)">예약됨</button>
      <button class="filter-tab" onclick="filterStatus('pending', this)">승인 대기</button>
      <button class="filter-tab" onclick="filterStatus('in_use', this)">사용 중</button>
      <button class="filter-tab" onclick="filterStatus('completed', this)">완료</button>
      <button class="filter-tab" onclick="filterStatus('canceled', this)">취소됨</button>
    </div>

    <div id="reservation-list"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <span class="empty-icon">📋</span>
      <div class="empty-title">예약 내역이 없습니다</div>
      <div class="empty-desc">강의실을 예약하고 편리하게 이용하세요</div>
      <a href="rooms.html" class="btn btn-primary mt-4">강의실 보러가기</a>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="home.html" data-page="home"><span class="nav-icon">🏠</span><span>홈</span></a>
    <a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span><span>강의실</span></a>
    <a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span><span>내 예약</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-icon">👤</span><span>내 정보</span></a>
  </nav>
</div>

<!-- 취소 확인 모달 -->
<div class="modal-backdrop" id="cancel-modal" style="display:none;" onclick="if(event.target===this)closeCancelModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">❌ 예약 취소</div>
    <p style="font-size:var(--font-md);color:var(--text-sub);margin-bottom:24px;">
      정말 이 예약을 취소하시겠습니까?<br>취소한 예약은 복구할 수 없습니다.
    </p>
    <div id="cancel-rv-info" style="background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;"></div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-ghost btn-full" onclick="closeCancelModal()">아니요</button>
      <button class="btn btn-danger btn-full btn-lg" onclick="confirmCancel()">취소 확인</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
if (!initPage('my')) {}

const user = Session.currentUser;
let currentFilter = 'all';
let cancelTargetId = null;

const statusConfig = {
  reserved:  { label: '예약 완료', color: 'var(--primary)', bg: 'rgba(26,58,92,0.08)' },
  pending:   { label: '승인 대기', color: 'var(--warning)', bg: 'rgba(243,156,18,0.1)' },
  in_use:    { label: '사용 중', color: 'var(--success)', bg: 'rgba(39,174,96,0.1)' },
  completed: { label: '완료', color: 'var(--text-sub)', bg: 'rgba(149,165,166,0.1)' },
  canceled:  { label: '취소됨', color: 'var(--danger)', bg: 'rgba(231,76,60,0.1)' },
};

function filterStatus(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const myReservations = DB.reservations
    .filter(r => r.user_id === user.id)
    .filter(r => currentFilter === 'all' || r.status === currentFilter)
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  const list = document.getElementById('reservation-list');
  const empty = document.getElementById('empty-state');

  if (myReservations.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = myReservations.map(rv => {
    const room = Room.getById(rv.room_id);
    const sc = statusConfig[rv.status] || statusConfig.completed;
    const canCancel = ['reserved','pending'].includes(rv.status);
    const startH = new Date(rv.start_time).getHours();
    return `
      <div class="reservation-card ${rv.status}" style="margin-bottom:14px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div class="reservation-room">${room ? room.icon + ' ' + room.room_name : '알 수 없음'}</div>
            <div class="reservation-time">
              📅 ${formatDate(rv.start_time)}<br>
              ⏰ ${formatTime(rv.start_time)} ~ ${formatTime(rv.end_time)}
            </div>
            <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
              <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:16px;font-size:var(--font-xs);font-weight:700;color:${sc.color};background:${sc.bg};">
                ${sc.label}
              </span>
              ${rv.purpose ? `<span style="font-size:var(--font-xs);color:var(--text-sub);">📌 ${rv.purpose}</span>` : ''}
              ${rv.instrument_use ? '<span style="font-size:var(--font-xs);color:var(--text-sub);">🎵 악기 사용</span>' : ''}
            </div>
            ${rv.used_equipments && rv.used_equipments.length > 0 ? `
              <div style="margin-top:8px;font-size:var(--font-xs);color:var(--text-sub);">
                🛠️ ${rv.used_equipments.join(', ')}
              </div>
            ` : ''}
          </div>
          ${canCancel ? `
            <button class="btn btn-sm" style="color:var(--danger);border:1px solid var(--danger);background:transparent;flex-shrink:0;white-space:nowrap;"
                    onclick="openCancelModal('${rv.reservation_id}', '${room?.room_name || ''}', '${formatDate(rv.start_time)} ${formatTime(rv.start_time)}~${formatTime(rv.end_time)}')">
              취소
            </button>
          ` : ''}
        </div>
        <div style="margin-top:10px;font-size:var(--font-xs);color:var(--text-light);">
          신청 시각: ${formatDatetime(rv.created_at)}
        </div>
      </div>
    `;
  }).join('');
}

function openCancelModal(rvId, roomName, timeStr) {
  cancelTargetId = rvId;
  document.getElementById('cancel-rv-info').innerHTML = `
    <div style="font-weight:700;font-size:var(--font-md);">🚪 ${roomName}</div>
    <div style="color:var(--text-sub);font-size:var(--font-sm);">⏰ ${timeStr}</div>
  `;
  document.getElementById('cancel-modal').style.display = 'flex';
}

function closeCancelModal() {
  document.getElementById('cancel-modal').style.display = 'none';
  cancelTargetId = null;
}

function confirmCancel() {
  if (!cancelTargetId) return;
  const result = Reservation.cancel(cancelTargetId, user.id);
  if (result.success) {
    showToast('예약이 취소되었습니다.', 'success');
    closeCancelModal();
    renderList();
  } else {
    showToast(result.error, 'error');
  }
}

renderList();
</script>
</body>
</html>
