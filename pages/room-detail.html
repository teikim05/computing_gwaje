<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의실 상세 - 강의실 대여 시스템</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 20px;
    }
    .date-nav button {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: white;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .date-nav button:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .date-nav .date-display {
      text-align: center;
    }
    .date-nav .date-main {
      font-size: var(--font-lg);
      font-weight: 800;
      color: var(--primary);
    }
    .date-nav .date-sub {
      font-size: var(--font-xs);
      color: var(--text-sub);
    }

    .room-detail-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 24px 20px;
      margin: -20px -16px 20px;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    @media (min-width: 768px) {
      .room-detail-header {
        margin: 0 0 24px;
        border-radius: var(--radius);
      }
    }
    .room-detail-header .rh-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .room-detail-header .rh-name {
      font-size: var(--font-2xl);
      font-weight: 800;
      margin-bottom: 4px;
    }
    .room-detail-header .rh-loc {
      font-size: var(--font-sm);
      opacity: 0.75;
    }

    .slot-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .slot-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-xs);
      font-weight: 600;
      color: var(--text-sub);
    }

    .slot-legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .time-slots-grid-mobile {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .slot-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      border: 2px solid;
      font-size: var(--font-sm);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      position: relative;
    }

    .slot-item .slot-time {
      font-size: var(--font-xs);
      margin-bottom: 2px;
    }

    .slot-item .slot-status-text {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
    }

    .slot-item.available {
      background: rgba(39,174,96,0.08);
      border-color: rgba(39,174,96,0.3);
      color: var(--success);
    }
    .slot-item.available:hover {
      background: rgba(39,174,96,0.2);
      border-color: var(--success);
      transform: scale(1.02);
    }
    .slot-item.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      transform: scale(1.03);
      box-shadow: 0 4px 12px rgba(26,58,92,0.25);
    }
    .slot-item.selected .slot-status-text { opacity: 0.8; }
    .slot-item.rented {
      background: rgba(231,76,60,0.06);
      border-color: rgba(231,76,60,0.2);
      color: var(--danger);
      cursor: not-allowed;
      opacity: 0.75;
    }
    .slot-item.class {
      background: rgba(41,128,185,0.06);
      border-color: rgba(41,128,185,0.2);
      color: var(--info);
      cursor: not-allowed;
      opacity: 0.75;
    }
    .slot-item.unavailable {
      background: rgba(189,195,199,0.2);
      border-color: rgba(189,195,199,0.3);
      color: var(--disabled);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .book-panel {
      position: sticky;
      bottom: 70px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -4px 24px rgba(26,58,92,0.12);
      padding: 16px 20px;
      z-index: 50;
      display: none;
    }
    .book-panel.visible { display: block; }
    @media (min-width: 768px) {
      .book-panel {
        position: static;
        border-radius: var(--radius);
        margin-top: 20px;
      }
      .book-panel.visible { display: block; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="app-container">
  <!-- 데스크탑 헤더 -->
  <header class="desktop-header">
    <div class="logo">🏛️ 강의실 <span>대여</span> 시스템</div>
    <div class="header-right">
      <div class="user-info">👤 <span class="user-name-display"></span></div>
      <button class="header-logout-btn logout-btn">로그아웃</button>
    </div>
  </header>

  <!-- 데스크탑 사이드바 -->
  <aside class="desktop-sidebar">
    <div style="padding:20px 24px;margin-bottom:8px;">
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:16px;">
        <div style="font-size:var(--font-sm);color:rgba(255,255,255,0.6);margin-bottom:4px;">👤 <span class="user-id-display"></span></div>
        <div style="font-size:var(--font-lg);font-weight:700;color:white;" class="user-name-display"></div>

    </div>
    <div class="sidebar-label">메뉴</div>
    <ul class="sidebar-nav">
      <li><a href="home.html" data-page="home"><span class="nav-icon">🏠</span> 홈</a></li>
      <li><a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span> 강의실 목록</a></li>
      <li><a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span> 내 예약</a></li>
      <li><a href="profile.html" data-page="profile"><span class="nav-icon">👤</span> 내 정보</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-nav admin-only">
      <li><a href="admin.html" data-page="admin"><span class="nav-icon">🛠️</span> 관리자 페이지</a></li>
    </ul>
    <div style="margin-top:auto;padding:20px 12px 0;">
      <button class="logout-btn" style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:8px;color:rgba(255,255,255,0.6);font-size:var(--font-sm);width:100%;background:none;border:none;cursor:pointer;">
        <span>🚪</span> 로그아웃

    </div>
  </aside>

  <!-- 모바일 헤더 -->
  <header class="mobile-header">
    <button onclick="history.back()" style="color:white;font-size:22px;background:none;border:none;cursor:pointer;padding:4px;">‹</button>
    <div class="logo" id="mobile-room-name">강의실 상세</div>
    <button class="header-logout-btn logout-btn" style="padding:6px 12px !important;font-size:var(--font-xs) !important;">로그아웃</button>
  </header>

  <!-- 메인 -->
  <main class="main-content">
    <div id="room-not-found" style="display:none;" class="empty-state">
      <span class="empty-icon">❌</span>
      <div class="empty-title">강의실을 찾을 수 없습니다</div>

    <div id="room-detail-content">

      <div class="room-detail-header">
        <div class="rh-icon" id="room-icon"></div>
        <div class="rh-name" id="room-name"></div>
        <div class="rh-loc" id="room-loc"></div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;" id="room-badges"></div>
      </div>

      <!-- 강의실 정보 -->
      <div class="card mb-6">
        <div class="card-header"><h3>📋 강의실 정보</h3></div>
        <div class="card-body">
          <p id="room-desc" style="font-size:var(--font-md);color:var(--text-sub);line-height:1.7;margin-bottom:16px;"></p>
          <div style="font-weight:700;font-size:var(--font-md);margin-bottom:10px;">🛠️ 구비 교구/장비</div>
          <div class="equipment-list" id="equipment-list"></div>
        </div>
      </div>

      <!-- 날짜 선택 -->
      <div class="date-nav">
        <button onclick="changeDate(-1)">‹</button>
        <div class="date-display">
          <div class="date-main" id="date-main"></div>
          <div class="date-sub" id="date-sub"></div>
        </div>
        <button onclick="changeDate(1)">›</button>
      </div>

      <!-- 슬롯 범례 -->
      <div class="slot-legend">
        <div class="slot-legend-item"><div class="slot-legend-dot" style="background:rgba(39,174,96,0.3);border:2px solid rgba(39,174,96,0.5);"></div>선택 가능</div>
        <div class="slot-legend-item"><div class="slot-legend-dot" style="background:var(--primary);"></div>선택됨</div>
        <div class="slot-legend-item"><div class="slot-legend-dot" style="background:rgba(231,76,60,0.2);border:2px solid rgba(231,76,60,0.3);"></div>대여 중</div>
        <div class="slot-legend-item"><div class="slot-legend-dot" style="background:rgba(41,128,185,0.15);border:2px solid rgba(41,128,185,0.3);"></div>수업</div>
      </div>

      <!-- 시간 선택 그리드 -->
      <div style="font-weight:700;font-size:var(--font-lg);color:var(--primary);margin-bottom:12px;">⏰ 시간 선택 <span style="font-size:var(--font-sm);color:var(--text-sub);font-weight:500;">(30분 단위)</span></div>
      <div class="time-slots-grid-mobile" id="time-slots"></div>

      <!-- 선택된 시간 표시 -->
      <div id="selected-info" style="display:none;padding:14px 20px;background:rgba(26,58,92,0.07);border-radius:var(--radius-sm);margin-bottom:16px;border-left:4px solid var(--primary);">
        <div style="font-weight:700;color:var(--primary);font-size:var(--font-md);margin-bottom:4px;">✅ 선택된 시간</div>
        <div id="selected-time-display" style="font-size:var(--font-sm);color:var(--text-sub);"></div>
      </div>

      <!-- 사용 불가 메시지 -->

        <span class="alert-icon">🚫</span>
        <span>이 시간대는 사용할 수 없습니다.</span>

      <!-- 예약 버튼 -->
      <div class="book-panel visible" id="book-panel" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div>
            <div style="font-size:var(--font-xs);color:var(--text-sub);">선택된 시간</div>
            <div id="book-panel-time" style="font-weight:700;color:var(--primary);font-size:var(--font-md);"></div>
          </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="home.html" data-page="home"><span class="nav-icon">🏠</span><span>홈</span></a>
    <a href="rooms.html" data-page="rooms"><span class="nav-icon">🚪</span><span>강의실</span></a>
    <a href="my-reservations.html" data-page="my"><span class="nav-icon">📋</span><span>내 예약</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-icon">👤</span><span>내 정보</span></a>
  </nav>
</div>

<!-- 예약 모달 -->
<div class="modal-backdrop" id="booking-modal" style="display:none;" onclick="if(event.target===this)closeBookingModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📝 예약 신청</div>

    <div id="modal-room-info" style="background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;">
      <div style="font-weight:700;font-size:var(--font-lg);" id="modal-room-name"></div>
      <div style="color:var(--text-sub);font-size:var(--font-sm);" id="modal-time-info"></div>
    </div>

    <!-- 승인 필요 안내 -->
    <div id="approval-notice" style="display:none;" class="alert alert-warning mb-4">

      <span>이 강의실은 <strong>조교 승인</strong>이 필요합니다.<br>신청 후 승인을 기다려주세요. (오후 6시 이후 신청 반려)</span>
    </div>

    <!-- 사용 목적 -->
    <div class="form-group">
      <label class="form-label">사용 목적 <span class="required">*</span></label>
      <select class="form-select" id="purpose-select">
        <option value="">선택하세요</option>
        <option value="개인 연습">개인 연습</option>
        <option value="합주 연습">합주 연습</option>
        <option value="스터디">스터디</option>
        <option value="동아리 활동">동아리 활동</option>
        <option value="발표 준비">발표 준비</option>
        <option value="강의">강의</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <!-- 악기 사용 여부 -->
    <div class="form-group">
      <label class="form-label">악기 사용 여부 <span class="required">*</span></label>
      <div class="radio-group">
        <label class="radio-card" id="instrument-yes" onclick="selectInstrument(true)">
          <input type="radio" name="instrument" value="yes"> 🎵 사용함
        </label>
        <label class="radio-card" id="instrument-no" onclick="selectInstrument(false)">
          <input type="radio" name="instrument" value="no"> 📚 사용 안 함
        </label>
      </div>
    </div>

    <!-- 사용 교구 선택 -->
    <div class="form-group" id="equipment-select-group">
      <label class="form-label">사용할 교구/장비 선택</label>
      <div class="checkbox-group" id="equipment-checkboxes"></div>
    </div>

    <div id="booking-error" class="alert alert-danger" style="display:none;">
      <span class="alert-icon">⚠️</span>
      <span id="booking-error-msg"></span>
    </div>

    <div style="display:flex;gap:12px;margin-top:4px;">
      <button class="btn btn-ghost btn-full" onclick="closeBookingModal()">취소</button>
      <button class="btn btn-primary btn-full btn-lg" onclick="submitBooking()">✅ 예약 신청</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
if (!initPage('rooms')) {}

const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('id');
const room = Room.getById(roomId);

if (!room) {
  document.getElementById('room-not-found').style.display = 'block';
  document.getElementById('room-detail-content').style.display = 'none';
} else {
  document.getElementById('mobile-room-name').textContent = room.room_name;
  document.getElementById('room-icon').textContent = room.icon;
  document.getElementById('room-name').textContent = room.room_name;
  document.getElementById('room-loc').textContent = `${room.location} · 수용인원 ${room.capacity}명`;
  document.getElementById('room-desc').textContent = room.description;

  // 뱃지
  const statusNow = Room.getCurrentStatus(roomId);
  document.getElementById('room-badges').innerHTML = `
    <span class="status-badge status-${statusNow}" style="font-size:var(--font-sm);">${Room.getStatusLabel(statusNow)}</span>
    ${room.requires_approval ? '<span class="approval-required">🔑 조교 승인 필요</span>' : ''}
  `;

  // 교구 목록
  const equipment = Room.getEquipment(roomId);
  document.getElementById('equipment-list').innerHTML = equipment.length
    ? equipment.map(e => `<span class="equipment-chip"><span class="chip-icon">🔧</span>${e.name} ${e.quantity > 1 ? '×' + e.quantity : ''}</span>`).join('')
    : '<span style="color:var(--text-light)">등록된 교구가 없습니다</span>';

  // 모달 교구 체크박스
  document.getElementById('equipment-checkboxes').innerHTML = equipment
    .map(e => `
      <label class="checkbox-item">
        <input type="checkbox" value="${e.name}">
        <span>🔧 ${e.name} ${e.quantity > 1 ? '(×' + e.quantity + ')' : ''}</span>
      </label>
    `).join('') || '<p style="color:var(--text-light);font-size:var(--font-sm);">교구 없음</p>';
}

// ─── 날짜/시간 슬롯 ───────────────────────────────────────
let currentDate = new Date();
currentDate.setHours(0,0,0,0);
let selectedSlots = [];

function changeDate(delta) {
  const newDate = new Date(currentDate);
  newDate.setDate(newDate.getDate() + delta);
  if (newDate < new Date().setHours(0,0,0,0)) return; // 과거 불가
  currentDate = newDate;
  selectedSlots = [];
  renderSlots();
  updateBookPanel();
}

function renderSlots() {
  const days = ['일','월','화','수','목','금','토'];
  const d = currentDate;
  document.getElementById('date-main').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById('date-sub').textContent =
    `${days[d.getDay()]}요일`;

  if (!room) return;

  const slots = [];
  for (let h = 8; h < 22; h++) {
    for (let m = 0; m < 60; m += 30) {
      const dt = new Date(d);
      dt.setHours(h, m, 0, 0);
      slots.push(dt);
    }
  }

  const grid = document.getElementById('time-slots');
  grid.innerHTML = slots.map(dt => {
    const timeStr = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const dtEnd = new Date(dt.getTime() + 30*60000);
    const timeEndStr = `${String(dtEnd.getHours()).padStart(2,'0')}:${String(dtEnd.getMinutes()).padStart(2,'0')}`;
    const status = Reservation.getSlotStatus(roomId, dt);
    const isSelected = selectedSlots.some(s => s.getTime() === dt.getTime());
    const slotClass = isSelected ? 'selected' : status;
    const statusLabels = { available:'선택 가능', rented:'대여 중', class:'수업', unavailable:'사용 불가' };
    const isDisabled = status !== 'available';
    return `
      <div class="slot-item ${slotClass}" 
           onclick="${isDisabled ? `showUnavailable('${status}')` : `toggleSlot(new Date(${dt.getTime()}))`}"
           data-time="${dt.getTime()}">
        <div class="slot-time">${timeStr}~${timeEndStr}</div>
        <div class="slot-status-text">${isSelected ? '✓ 선택됨' : statusLabels[status]}</div>
      </div>
    `;
  }).join('');
}

function toggleSlot(dt) {
  const idx = selectedSlots.findIndex(s => s.getTime() === dt.getTime());
  if (idx >= 0) {
    selectedSlots.splice(idx, 1);
  } else {
    // 연속된 슬롯만 허용 (최대 4개 = 2시간)
    if (selectedSlots.length >= 4) {
      showToast('최대 2시간(4슬롯)까지 선택 가능합니다.', 'warning');
      return;
    }
    if (selectedSlots.length > 0) {
      selectedSlots.sort((a,b) => a-b);
      const first = selectedSlots[0];
      const last = selectedSlots[selectedSlots.length-1];
      const isNext = dt.getTime() === last.getTime() + 30*60000;
      const isPrev = dt.getTime() === first.getTime() - 30*60000;
      if (!isNext && !isPrev) {
        showToast('연속된 시간대만 선택 가능합니다.', 'warning');
        return;
      }
    }
    selectedSlots.push(dt);
  }
  document.getElementById('unavailable-msg').style.display = 'none';
  renderSlots();
  updateBookPanel();
}

function showUnavailable(status) {
  const msg = document.getElementById('unavailable-msg');
  msg.style.display = 'flex';
  setTimeout(() => msg.style.display = 'none', 3000);
}

function updateBookPanel() {
  const panel = document.getElementById('book-panel');
  const info = document.getElementById('selected-info');
  if (selectedSlots.length === 0) {
    panel.style.display = 'none';
    info.style.display = 'none';
    return;
  }
  selectedSlots.sort((a,b) => a-b);
  const start = selectedSlots[0];
  const end = new Date(selectedSlots[selectedSlots.length-1].getTime() + 30*60000);
  const fmt = dt => `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  const timeText = `${fmt(start)} ~ ${fmt(end)} (${selectedSlots.length*30}분)`;
  document.getElementById('selected-time-display').textContent = timeText;
  document.getElementById('book-panel-time').textContent = timeText;
  info.style.display = 'block';
  panel.style.display = 'block';
}

function clearSelection() {
  selectedSlots = [];
  renderSlots();
  updateBookPanel();
}

// ─── 예약 모달 ────────────────────────────────────────────
let instrumentUse = null;

function openBookingModal() {
  if (!room || selectedSlots.length === 0) return;
  instrumentUse = null;
  document.getElementById('purpose-select').value = '';
  document.querySelectorAll('#booking-modal .radio-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('#equipment-checkboxes input').forEach(cb => cb.checked = false);
  document.getElementById('booking-error').style.display = 'none';
  document.getElementById('approval-notice').style.display = room.requires_approval ? 'flex' : 'none';

  selectedSlots.sort((a,b)=>a-b);
  const start = selectedSlots[0];
  const end = new Date(selectedSlots[selectedSlots.length-1].getTime()+30*60000);
  const fmt = dt => `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  document.getElementById('modal-room-name').textContent = `${room.icon} ${room.room_name}`;
  document.getElementById('modal-time-info').textContent =
    `📅 ${formatDate(start)} ${fmt(start)} ~ ${fmt(end)}`;
  document.getElementById('booking-modal').style.display = 'flex';
}

function closeBookingModal() {
  document.getElementById('booking-modal').style.display = 'none';
}

function selectInstrument(val) {
  instrumentUse = val;
  document.getElementById('instrument-yes').classList.toggle('selected', val === true);
  document.getElementById('instrument-no').classList.toggle('selected', val === false);
}

function submitBooking() {
  const purpose = document.getElementById('purpose-select').value;
  const errDiv = document.getElementById('booking-error');
  const errMsg = document.getElementById('booking-error-msg');

  if (!purpose) { errMsg.textContent = '사용 목적을 선택하세요.'; errDiv.style.display='flex'; return; }
  if (instrumentUse === null) { errMsg.textContent = '악기 사용 여부를 선택하세요.'; errDiv.style.display='flex'; return; }

  errDiv.style.display = 'none';
  selectedSlots.sort((a,b)=>a-b);
  const start = selectedSlots[0];
  const end = new Date(selectedSlots[selectedSlots.length-1].getTime()+30*60000);
  const usedEquip = [...document.querySelectorAll('#equipment-checkboxes input:checked')].map(cb=>cb.value);

  const result = Reservation.create({
    user_id: Session.currentUser.id,
    room_id: roomId,
    start_time: start.toISOString(),
    end_time: end.toISOString(),
    used_equipments: usedEquip,
    purpose,
    instrument_use: instrumentUse
  });

  if (result.success) {
    closeBookingModal();
    clearSelection();
    const statusMsg = room.requires_approval ? '승인 대기 상태로 신청되었습니다.\n(관리자 승인 후 이용 가능)' : '강의실 대여 예약이 완료되었습니다!';
    showToast(`✅ ${statusMsg}`, 'success', 4000);
    renderSlots();

    setTimeout(() => {
      if (confirm(`${statusMsg}\n\n지금 [내 예약] 페이지로 이동하여 확인하시겠습니까?`)) {
        window.location.href = 'my-reservations.html';
      }
    }, 300);
  } else {
    errMsg.textContent = result.error;
    errDiv.style.display = 'flex';
  }
}

renderSlots();
</script>
</body>
</html>
